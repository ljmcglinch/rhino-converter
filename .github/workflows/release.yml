name: Build signed office release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            architecture: x64
            package: windows
          - runner: macos-15
            architecture: arm64
            package: mac-arm64
          - runner: macos-15-intel
            architecture: x64
            package: mac-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Validate version and update configuration
        shell: bash
        run: |
          python release_tools.py validate --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
      - name: Install Windows installer builder
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install nsis --yes --no-progress
      - name: Build Windows setup
        if: runner.os == 'Windows'
        shell: cmd
        run: Build-Installer-Windows.bat --no-pause
      - name: Build Mac disk image and update ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: bash Build-Installer-Mac.command --no-pause
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: installer-${{ matrix.package }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/RhinoConverter-Setup.exe
            dist/RhinoConverter-Mac-*.dmg
            dist/RhinoConverter-Mac-*.zip
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install signing library
        run: python -m pip install cryptography==50.0.2
      - name: Download this run's packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'installer-*' --dir artifacts
      - name: Collect packages
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          out = Path('release-files'); out.mkdir()
          for source in Path('artifacts').rglob('*'):
              if source.is_file():
                  target = out/source.name
                  if target.exists(): raise SystemExit('Duplicate release package name')
                  shutil.copyfile(source, target)
          PY
      - name: Sign release metadata
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: python release_tools.py sign release-files --repository "$GITHUB_REPOSITORY" --version "${GITHUB_REF_NAME#v}"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Rhino Converter $GITHUB_REF_NAME" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
